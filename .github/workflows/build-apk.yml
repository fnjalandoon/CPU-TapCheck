name: Build CPU TapCheck APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          -Pkotlin.compiler.execution.strategy=daemon
          -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          --no-parallel
          --no-configuration-cache
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPU-TapCheck-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
